# XcodeGen spec: run `xcodegen` in this folder to (re)generate Zipling.xcodeproj.
name: Zipling
options:
  bundleIdPrefix: com.observantsystems
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Zipling:
    type: application
    platform: macOS
    sources:
      - path: Zipling
    info:
      path: Zipling/Info.plist
      properties:
        CFBundleName: Zipling
        CFBundleDisplayName: Zipling
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: "© 2026 Observant Systems"
        CFBundleDocumentTypes:
          - CFBundleTypeName: Zipling Archive
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes: [com.observantsystems.zipling-archive]
            # macOS draws the .zlg icon: a page badged with the app icon and the label below.
            CFBundleTypeIconSystemGenerated: true
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.observantsystems.zipling-archive
            UTTypeDescription: Zipling Archive
            UTTypeConformsTo: [public.data, public.archive]
            UTTypeTagSpecification:
              public.filename-extension: [zlg]
            UTTypeIcons:
              UTTypeIconBadgeName: AppIcon
              UTTypeIconText: ZLG
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.observantsystems.zipling
        PRODUCT_NAME: Zipling
        # The Rust engine: C header + module map, and the static library.
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/../engine/arca-ffi/include
        LIBRARY_SEARCH_PATHS: $(SRCROOT)/../engine/target/xcode/release
        OTHER_LDFLAGS: [-larca_ffi, -liconv]
        # The engine is built for Apple silicon only for now.
        ARCHS: arm64
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Local development signing; notarised Developer ID signing comes later.
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: NO
        # cargo writes outside the project's derived data.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        DEAD_CODE_STRIPPING: YES
    scheme:
      testTargets: [ZiplingTests]
    preBuildScripts:
      - name: Build Rust engine
        basedOnDependencyAnalysis: false
        script: |
          export PATH="/opt/homebrew/bin:$HOME/.cargo/bin:$PATH"
          cd "$SRCROOT/../engine"
          # A separate target dir: Xcode's environment (deployment target, SDK)
          # differs from the CLI's, and sharing one dir would rebuild every time.
          CARGO_TARGET_DIR="$SRCROOT/../engine/target/xcode" cargo build --release -p arca-ffi

  ZiplingTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: ZiplingTests
    dependencies:
      - target: Zipling
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.observantsystems.zipling.tests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Zipling.app/Contents/MacOS/Zipling
        BUNDLE_LOADER: $(TEST_HOST)
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/../engine/arca-ffi/include
        ARCHS: arm64
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual

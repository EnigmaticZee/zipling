# XcodeGen spec: run `xcodegen` in this folder to (re)generate Zipling.xcodeproj.
name: Zipling
options:
  bundleIdPrefix: com.observantsystems
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Zipling:
    type: application
    platform: macOS
    sources:
      - path: Zipling
    info:
      path: Zipling/Info.plist
      properties:
        CFBundleName: Zipling
        CFBundleDisplayName: Zipling
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: "© 2026 Observant Systems"
        CFBundleDocumentTypes:
          - CFBundleTypeName: Zipling Archive
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes: [com.observantsystems.zipling-archive]
            # macOS draws the .zlg icon: a page badged with the app icon and the label below.
            CFBundleTypeIconSystemGenerated: true
          - CFBundleTypeName: Archive
            CFBundleTypeRole: Viewer
            # Opens every other archive, without taking over as the default app.
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.archive
              - public.zip-archive
              - org.7-zip.7-zip-archive
              - public.tar-archive
              - org.gnu.gnu-zip-archive
              - org.gnu.gnu-zip-tar-archive
              - public.bzip2-archive
              - public.tar-bzip2-archive
              - org.tukaani.xz-archive
              - org.tukaani.tar-xz-archive
              - public.z-archive
              - com.microsoft.cab
              - public.iso-image
              - com.apple.disk-image-udif
              - com.apple.xar-archive
              - com.apple.installer-package-archive
              - public.cpio-archive
              - com.sun.java-archive
              - com.apple.xip-archive
              - com.stuffit.archive.sit
              - com.rarlab.rar-archive
              - com.observantsystems.zipling.zstd
              - com.observantsystems.zipling.lz4
              - com.observantsystems.zipling.lzma
              - com.observantsystems.zipling.wim
              - com.observantsystems.zipling.rpm
              - com.observantsystems.zipling.deb
              - com.observantsystems.zipling.arj
              - com.observantsystems.zipling.lha
              - com.observantsystems.zipling.apk
              - com.observantsystems.zipling.cbz
              - com.observantsystems.zipling.chm
              - com.observantsystems.zipling.msi
              - com.observantsystems.zipling.virtual-disk
              - com.observantsystems.zipling.squashfs
              - com.observantsystems.zipling.split-part
          - CFBundleTypeName: Files and Folders
            CFBundleTypeRole: Viewer
            # Never the default app for these: this lets any file or folder be dropped
            # on the Dock icon to compress it.
            LSHandlerRank: None
            LSItemContentTypes: [public.item, public.folder]
        # AppleScript: compress, extract and convert (Zipling.sdef).
        NSAppleScriptEnabled: true
        OSAScriptingDefinition: Zipling.sdef
        # Finder's right-click menu (Quick Actions and Services).
        NSServices:
          - NSMenuItem: { default: Compress with Zipling }
            NSMessage: compressFiles
            NSPortName: Zipling
            NSRequiredContext: {}
            NSSendFileTypes: [public.item, public.folder]
          - NSMenuItem: { default: Extract Here with Zipling }
            NSMessage: extractFiles
            NSPortName: Zipling
            NSRequiredContext: {}
            NSSendFileTypes: [public.archive, public.disk-image, com.observantsystems.zipling-archive]
          - NSMenuItem: { default: Open in Zipling }
            NSMessage: openFiles
            NSPortName: Zipling
            NSRequiredContext: {}
            NSSendFileTypes: [public.archive, public.disk-image, com.observantsystems.zipling-archive]
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.observantsystems.zipling-archive
            UTTypeDescription: Zipling Archive
            UTTypeConformsTo: [public.data, public.archive]
            UTTypeTagSpecification:
              public.filename-extension: [zlg]
            UTTypeIcons:
              UTTypeIconBadgeName: AppIcon
              UTTypeIconText: ZLG
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.rarlab.rar-archive
            UTTypeDescription: RAR archive
            UTTypeConformsTo: [public.data, public.archive]
            UTTypeTagSpecification:
              public.filename-extension: [rar, cbr]
          - UTTypeIdentifier: com.observantsystems.zipling.zstd
            UTTypeDescription: Zstandard archive
            UTTypeConformsTo: [public.data, public.archive]
            UTTypeTagSpecification:
              public.filename-extension: [zst, tzst]
          - UTTypeIdentifier: com.observantsystems.zipling.lz4
            UTTypeDescription: LZ4 archive
            UTTypeConformsTo: [public.data, public.archive]
            UTTypeTagSpecification:
              public.filename-extension: [lz4, tlz4]
          - UTTypeIdentifier: com.observantsystems.zipling.lzma
            UTTypeDescription: LZMA archive
            UTTypeConformsTo: [public.data, public.archive]
            UTTypeTagSpecification:
              public.filename-extension: [lzma, tlz]
          - UTTypeIdentifier: com.observantsystems.zipling.wim
            UTTypeDescription: Windows Imaging archive
            UTTypeConformsTo: [public.data, public.archive]
            UTTypeTagSpecification:
              public.filename-extension: [wim, swm, esd]
          - UTTypeIdentifier: com.observantsystems.zipling.rpm
            UTTypeDescription: RPM package
            UTTypeConformsTo: [public.data, public.archive]
            UTTypeTagSpecification:
              public.filename-extension: [rpm]
          - UTTypeIdentifier: com.observantsystems.zipling.deb
            UTTypeDescription: Debian package
            UTTypeConformsTo: [public.data, public.archive]
            UTTypeTagSpecification:
              public.filename-extension: [deb]
          - UTTypeIdentifier: com.observantsystems.zipling.arj
            UTTypeDescription: ARJ archive
            UTTypeConformsTo: [public.data, public.archive]
            UTTypeTagSpecification:
              public.filename-extension: [arj]
          - UTTypeIdentifier: com.observantsystems.zipling.lha
            UTTypeDescription: LHA archive
            UTTypeConformsTo: [public.data, public.archive]
            UTTypeTagSpecification:
              public.filename-extension: [lha, lzh]
          - UTTypeIdentifier: com.observantsystems.zipling.apk
            UTTypeDescription: Android package
            UTTypeConformsTo: [public.data, public.archive]
            UTTypeTagSpecification:
              public.filename-extension: [apk]
          - UTTypeIdentifier: com.observantsystems.zipling.cbz
            UTTypeDescription: Comic book archive
            UTTypeConformsTo: [public.data, public.archive]
            UTTypeTagSpecification:
              public.filename-extension: [cbz, cb7]
          - UTTypeIdentifier: com.observantsystems.zipling.chm
            UTTypeDescription: Compiled HTML help
            UTTypeConformsTo: [public.data, public.archive]
            UTTypeTagSpecification:
              public.filename-extension: [chm]
          - UTTypeIdentifier: com.observantsystems.zipling.msi
            UTTypeDescription: Windows Installer package
            UTTypeConformsTo: [public.data, public.archive]
            UTTypeTagSpecification:
              public.filename-extension: [msi]
          - UTTypeIdentifier: com.observantsystems.zipling.virtual-disk
            UTTypeDescription: Virtual disk image
            UTTypeConformsTo: [public.data, public.archive, public.disk-image]
            UTTypeTagSpecification:
              public.filename-extension: [vhd, vhdx, vmdk, vdi, qcow2]
          - UTTypeIdentifier: com.observantsystems.zipling.squashfs
            UTTypeDescription: SquashFS image
            UTTypeConformsTo: [public.data, public.archive, public.disk-image]
            UTTypeTagSpecification:
              public.filename-extension: [squashfs, sfs]
          - UTTypeIdentifier: com.observantsystems.zipling.split-part
            UTTypeDescription: Split archive part
            UTTypeConformsTo: [public.data, public.archive]
            UTTypeTagSpecification:
              public.filename-extension: [001]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.observantsystems.zipling
        PRODUCT_NAME: Zipling
        # The Rust engine: C header + module map, and the static library (whose
        # bundled libbsc is C++, hence libc++).
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/../engine/arca-ffi/include
        LIBRARY_SEARCH_PATHS: $(SRCROOT)/../engine/target/xcode/release
        OTHER_LDFLAGS: [-larca_ffi, -liconv, -lc++]
        # The engine is built for Apple silicon only for now.
        ARCHS: arm64
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Local development signing; notarised Developer ID signing comes later.
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: NO
        # cargo writes outside the project's derived data.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        DEAD_CODE_STRIPPING: YES
    dependencies:
      - target: ArcaEngine
      # Embedded in Contents/PlugIns.
      - target: ZiplingQuickLook
    scheme:
      testTargets: [ZiplingTests]
    postBuildScripts:
      - name: Embed 7-Zip helper
        basedOnDependencyAnalysis: false
        script: |
          # The unmodified 7-Zip helper reads every non-Zipling format, in its own process.
          # tools/7zip/build.sh builds it from the pinned official source (run it once).
          HELPER="$SRCROOT/../tools/7zip/bin/7zz"
          DEST="$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Helpers"
          if [ -x "$HELPER" ]; then
            mkdir -p "$DEST"
            cp -f "$HELPER" "$DEST/7zz"
            codesign --force --sign "${EXPANDED_CODE_SIGN_IDENTITY:--}" --timestamp=none "$DEST/7zz"
          elif [ "$CONFIGURATION" = "Release" ]; then
            echo "error: tools/7zip/bin/7zz is missing. Run tools/7zip/build.sh once."
            exit 1
          else
            echo "warning: the 7-Zip helper isn't built yet, so this debug build uses Homebrew's 7zz. Run tools/7zip/build.sh."
          fi
      - name: Embed The Unarchiver's tools
        basedOnDependencyAnalysis: false
        script: |
          # lsar and unar read classic Mac formats and legacy file-name encodings, in
          # their own processes. tools/unar/build.sh builds them from pinned source.
          DEST="$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Helpers"
          for TOOL in lsar unar; do
            HELPER="$SRCROOT/../tools/unar/bin/$TOOL"
            if [ -x "$HELPER" ]; then
              mkdir -p "$DEST"
              cp -f "$HELPER" "$DEST/$TOOL"
              codesign --force --sign "${EXPANDED_CODE_SIGN_IDENTITY:--}" --timestamp=none "$DEST/$TOOL"
            elif [ "$CONFIGURATION" = "Release" ]; then
              echo "error: tools/unar/bin/$TOOL is missing. Run tools/unar/build.sh once."
              exit 1
            else
              echo "warning: The Unarchiver's $TOOL isn't built yet, so this debug build uses Homebrew's. Run tools/unar/build.sh."
            fi
          done

  ZiplingQuickLook:
    type: app-extension
    platform: macOS
    dependencies:
      - target: ArcaEngine
    sources:
      - path: ZiplingQuickLook
      # Lists .zlg archives in-process, and reads ZIP directories without a helper.
      - path: Zipling/Engine/Engine.swift
      - path: Zipling/Engine/Models.swift
      - path: Zipling/Archives/ZipDirectory.swift
    info:
      path: ZiplingQuickLook/Info.plist
      properties:
        CFBundleDisplayName: Zipling Quick Look
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSHumanReadableCopyright: "© 2026 Observant Systems"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.preview
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PreviewProvider
          NSExtensionAttributes:
            QLIsDataBasedPreview: true
            QLSupportsSearchableItems: false
            QLSupportedContentTypes: [com.observantsystems.zipling-archive, public.zip-archive]
    entitlements:
      path: ZiplingQuickLook/ZiplingQuickLook.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.observantsystems.zipling.quicklook
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/../engine/arca-ffi/include
        LIBRARY_SEARCH_PATHS: $(SRCROOT)/../engine/target/xcode/release
        OTHER_LDFLAGS: [-larca_ffi, -liconv, -lc++]
        ARCHS: arm64
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEAD_CODE_STRIPPING: YES

  ZiplingTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: ZiplingTests
    dependencies:
      - target: Zipling
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.observantsystems.zipling.tests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Zipling.app/Contents/MacOS/Zipling
        BUNDLE_LOADER: $(TEST_HOST)
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/../engine/arca-ffi/include
        ARCHS: arm64
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual

aggregateTargets:
  # The Rust engine, linked by the app and its Quick Look extension.
  ArcaEngine:
    settings:
      base:
        # The same environment the app builds in, so cargo doesn't rebuild for nothing.
        SDKROOT: macosx
        MACOSX_DEPLOYMENT_TARGET: "15.0"
    buildScripts:
      - name: Build Rust engine
        basedOnDependencyAnalysis: false
        script: |
          export PATH="/opt/homebrew/bin:$HOME/.cargo/bin:$PATH"
          cd "$SRCROOT/../engine"
          # A separate target dir: Xcode's environment (deployment target, SDK)
          # differs from the CLI's, and sharing one dir would rebuild every time.
          CARGO_TARGET_DIR="$SRCROOT/../engine/target/xcode" cargo build --release -p arca-ffi

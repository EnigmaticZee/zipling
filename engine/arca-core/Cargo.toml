[package]
name = "arca-core"
version.workspace = true
edition.workspace = true
publish = false
description = "Arca archive engine: content-aware, deduplicating, parallel archive format"

[dependencies]
anyhow = "1"
blake3 = { version = "1.8", features = ["rayon"] }
crossbeam-channel = "0.5"
fastcdc = "3"
filetime = "0.2"
lepton_jpeg = "0.5"
libc = "0.2"
liblzma = "0.4"
memchr = "2"
memmap2 = "0.9"
ppmd-rust = "1.5"
preflate-rs = "0.7"
rayon = "1.10"
xattr = "1.3"
zstd = "0.13"

[dev-dependencies]
tempfile = "3"

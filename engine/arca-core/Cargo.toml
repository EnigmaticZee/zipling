[package]
name = "arca-core"
version.workspace = true
edition.workspace = true
publish = false
description = "Arca archive engine: content-aware, deduplicating, parallel archive format"

[dependencies]
anyhow = "1"
blake3 = { version = "1.8", features = ["rayon"] }
crossbeam-channel = "0.5"
fastcdc = "3"
filetime = "0.2"
lepton_jpeg = "0.5"
libc = "0.2"
# Built from source: the app must not depend on a Homebrew dylib.
liblzma = { version = "0.4", features = ["static"] }
# For encoder memory estimates (the same vendored build `liblzma` uses).
liblzma-sys = { version = "0.4", features = ["static"] }
memchr = "2"
memmap2 = "0.9"
ppmd-rust = "1.5"
preflate-rs = "0.7"
rayon = "1.10"
xattr = "1.3"
zstd = "0.13"

[dev-dependencies]
flate2 = "1"
tempfile = "3"

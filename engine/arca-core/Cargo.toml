[package]
name = "arca-core"
version.workspace = true
edition.workspace = true
publish = false
description = "Arca archive engine: content-aware, deduplicating, parallel archive format"

[dependencies]
anyhow = "1"
blake3 = { version = "1.8", features = ["rayon"] }
crc32fast = "1"
# zlib-rs (a Rust port of zlib-ng, with ARM SIMD) for reading ZIP archives.
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
crossbeam-channel = "0.5"
fastcdc = "3"
filetime = "0.2"
lepton_jpeg = "0.5"
libc = "0.2"
lzma-sdk = { path = "../vendor/lzma-sdk", features = ["token-hook"] }
libbsc = { path = "../vendor/libbsc" }
zlib-pinned = { path = "../vendor/zlib" }
lzfse-pinned = { path = "../vendor/lzfse" }
memchr = "2"
memmap2 = "0.9"
preflate-rs = "0.7"
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
xattr = "1.3"
zstd = { version = "0.13", features = ["zstdmt"] }
reed-solomon-simd = "3.1.0"

[dev-dependencies]
tempfile = "3"
